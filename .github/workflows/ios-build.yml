name: Compilar IPA para iOS 12
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4
        
      - name: Configurar Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Generar esqueleto de iOS faltante
        run: flutter create --platforms=ios .

      - name: Aplicar CONFIGURACION_IOS.md (Inyectar Info.plist)
        run: |
           /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
           /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || true
           /usr/libexec/PlistBuddy -c "Add :FLTEnableImpeller bool false" ios/Runner/Info.plist || true
           /usr/libexec/PlistBuddy -c "Add :io.flutter.embedded_views_preview bool true" ios/Runner/Info.plist || true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar iOS (Payload)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r IPAD_JEAL.ipa Payload/
          
      - name: Entregar el archivo .ipa final
        uses: actions/upload-artifact@v4
        with:
          name: IPAD_JEAL_APP
          path: IPAD_JEAL.ipa